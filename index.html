<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#166b54">
  <title>สมุดเงินของฉัน</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f2f6f4;
      color: #18352b;
      font-family: system-ui, sans-serif;
      font-size: 16px;
    }
    main {
      max-width: 480px;
      margin: auto;
      padding: 24px 18px 40px;
    }
    h1 { margin-bottom: 6px; font-size: 28px; }
    .subtitle { margin-top: 0; color: #52665d; }
    .notice {
      padding: 14px;
      background: #fff4d6;
      border-radius: 12px;
      line-height: 1.6;
    }
    .card {
      margin-top: 20px;
      padding: 20px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 4px 18px #18352b0d;
    }
    label {
      display: block;
      margin: 18px 0 8px;
      font-weight: 600;
    }
    input, select, button {
      width: 100%;
      min-height: 52px;
      padding: 12px;
      font: inherit;
      border-radius: 12px;
      border: 1px solid #bacac2;
      background: white;
      color: #18352b;
    }
    #amount {
      font-size: 36px;
      text-align: right;
    }
    input:focus, select:focus {
      outline: 3px solid #b9e9d8;
      border-color: #166b54;
    }
    button {
      margin-top: 24px;
      border: none;
      background: #166b54;
      color: white;
      font-weight: 700;
    }
    button:disabled {
      background: #dce5e0;
      color: #52665d;
    }
    .hint {
      font-size: 14px;
      color: #52665d;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main>
    <h1>สมุดเงินของฉัน</h1>
    <p class="subtitle">จดง่าย รู้ว่าเงินไปไหน</p>

    <p class="notice">
      หน้าทดลอง: ยังไม่บันทึกข้อมูล
      และไม่เชื่อมต่อธนาคาร
    </p>

    <section class="card" aria-label="จดรายการ">
      <label for="type">ประเภทรายการ</label>
      <select id="type">
        <option value="expense">รายจ่าย</option>
        <option value="income">รายรับ</option>
        <option value="transfer" disabled>
          โอนระหว่างบัญชี — เพิ่มภายหลัง
        </option>
      </select>

      <label for="amount">จำนวนเงิน (บาท)</label>
      <input id="amount" type="text"
             inputmode="decimal"
             placeholder="0.00">

      <label for="account">บัญชีที่ใช้กับรายการนี้</label>
      <select id="account">
        <option>เงินเดือน</option>
        <option selected>ใช้จ่ายส่วนตัว</option>
        <option>เงินเก็บ</option>
        <option>เงินสำรอง</option>
        <option>เงินสำรองฉุกเฉิน</option>
        <option>เงินเหลือรายเดือน</option>
      </select>

      <label for="method">วิธีรับหรือจ่ายเงิน</label>
      <select id="method">
        <option>เงินสด</option>
        <option>เงินโอน / พร้อมเพย์</option>
      </select>

      <label for="detail">ซื้ออะไร / รายละเอียด</label>
      <input id="detail" type="text"
             maxlength="200"
             placeholder="เช่น ข้าวมันไก่ + น้ำ">

      <button type="button" disabled>
        บันทึก — จะเปิดใช้ในบทถัด ๆ ไป
      </button>

      <p class="hint">
        ตอนนี้ทดลองกรอกได้เท่านั้น
        เมื่อโหลดหน้าใหม่ ข้อมูลที่กรอกจะไม่ถูกเก็บไว้
      </p>
    </section>
  </main>
</body>
</html>
